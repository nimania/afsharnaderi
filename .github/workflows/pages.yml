name: Import original content and deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install migration dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pymupdf
      - name: Import historical documents, pages and media once
        if: ${{ hashFiles('site/IMPORT_MANIFEST.json') == '' }}
        run: python .github/scripts/import_archive.py
      - name: Recover HTML documents embedded in the old site
        if: ${{ hashFiles('site/IMPORT_MANIFEST.json') != '' }}
        run: python .github/scripts/import_embedded.py
      - name: Postprocess imported historical pages
        if: ${{ hashFiles('site/IMPORT_MANIFEST.json') != '' }}
        run: python .github/scripts/postprocess.py
      - name: Build integrated local archives and galleries
        if: ${{ hashFiles('site/IMPORT_MANIFEST.json') != '' }}
        run: python .github/scripts/render_site.py
      - name: Convert Ismail Mirza family history PDF into full HTML
        run: python .github/scripts/publish_ismail_pdf.py
      - name: Audit internal and previous-domain links
        if: ${{ hashFiles('site/IMPORT_MANIFEST.json') != '' }}
        run: python .github/scripts/audit_site.py
      - name: Check in imported public archive
        run: |
          if ! git diff --quiet || [ -n "$(git ls-files --others --exclude-standard site)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site docs/LINK_AUDIT.md
            git commit -m "archive: preserve public source pages, PDFs and media locally"
            git push origin HEAD:main
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload local website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke-test published site
        shell: bash
        run: |
          set -euo pipefail
          base="https://nimania.github.io/afsharnaderi"
          for path in "" "archive.html" "family.html" "gallery.html" "search.html" "legacy-index.html" "davoud2/dpoems.html" "davoud2/poems/p00.html" "davoud2/dslide.html" "drghan/index.html" "docs/shajareh.pdf" "docs/ismail_memo.pdf" "tabaar/png_18.htm" "ismail/ismail.html" "ismail/tarikhcheh-images/page-34.jpg"; do
            url="${base}/${path}"
            code="$(curl --location --silent --output /dev/null --write-out '%{http_code}' --retry 4 --retry-delay 2 --retry-all-errors "${url}")"
            echo "${code}  ${url}"
            if [ "${code}" != "200" ]; then
              echo "ERROR: Published URL is not reachable: ${url}"
              exit 1
            fi
          done
