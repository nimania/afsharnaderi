name: Import original content and deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        if: ${{ hashFiles('site/IMPORT_MANIFEST.json') == '' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install migration dependencies
        if: ${{ hashFiles('site/IMPORT_MANIFEST.json') == '' }}
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Import historical documents, pages and media once
        if: ${{ hashFiles('site/IMPORT_MANIFEST.json') == '' }}
        run: python .github/scripts/import_archive.py
      - name: Postprocess imported historical pages
        if: ${{ hashFiles('site/IMPORT_MANIFEST.json') != '' }}
        run: python .github/scripts/postprocess.py
      - name: Build integrated local archives and galleries
        if: ${{ hashFiles('site/IMPORT_MANIFEST.json') != '' }}
        run: python .github/scripts/render_site.py
      - name: Check in imported public archive
        run: |
          if ! git diff --quiet || [ -n "$(git ls-files --others --exclude-standard site)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site
            git commit -m "archive: preserve public source pages, PDFs and media locally"
            git push origin HEAD:main
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload local website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
